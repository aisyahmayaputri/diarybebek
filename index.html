<!DOCTYPE html>
<html lang="en" data-theme="terang"> <!-- Default tema: Terang -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal</title>
    
    <!-- Google Fonts: Menggunakan Quicksand untuk kesan "Cute-coded" tapi tetap bersih -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Terpisah -->
    <link rel="stylesheet" href="./core/theme.css">
    <link rel="stylesheet" href="./shared/global.css">
    <link rel="stylesheet" href="./features/home/home.css">
</head>
<body>

    <!-- Container Utama Halaman Home -->
    <main id="home-view" class="view-container active">
        
        <!-- Bagian Atas: Sapaan & Tanggal -->
        <header class="home-header">
            <h1 id="daily-greeting" class="greeting-text">Selamat...</h1>
            <p id="current-date" class="date-text">Memuat tanggal...</p>
        </header>

        <!-- Bagian Akses Cepat -->
        <section class="quick-access">
            <div class="access-card bounce-hover">Pencarian</div>
            <div class="access-card bounce-hover">Galeri</div>
            <div class="access-card bounce-hover">Statistik</div>
            <div class="access-card bounce-hover">Tag</div>
        </section>

        <!-- Tombol Plus (Entry Baru) -->
        <button id="btn-add-new" class="fab-button bounce-hover" aria-label="Buat Entri Baru">
            +
        </button>

    </main>

    <!-- JS Terpisah menggunakan tipe modul -->
    <script type="module" src="./core/app.js"></script>
</body>
</html>
