<!DOCTYPE html>
<html lang="en" data-theme="terang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal</title>
    
    <!-- Google Fonts: Quicksand untuk kesan "Cute-coded" -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Core & Shared CSS -->
    <link rel="stylesheet" href="./core/theme.css">
    <link rel="stylesheet" href="./shared/global.css">
    
    <!-- Features CSS (Home) -->
    <link rel="stylesheet" href="./features/home/home.css">
    <link rel="stylesheet" href="./features/create-menu/create-menu.css">
    <link rel="stylesheet" href="./features/mood-widget/mood-widget.css">
    <link rel="stylesheet" href="./features/mini-calendar/mini-calendar.css">
    <link rel="stylesheet" href="./features/entry-highlights/entry-highlights.css">
    
    <!-- Features CSS (Editor) -->
    <link rel="stylesheet" href="./features/entry-editor/entry-editor.css">
    <link rel="stylesheet" href="./features/canvas-draw/canvas-draw.css">
    <link rel="stylesheet" href="./features/entry-background/entry-background.css">
    <link rel="stylesheet" href="./features/text-format/text-format.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. HALAMAN UTAMA (HOME)                    -->
    <!-- ========================================== -->
    <main id="home-view" class="view-container active">
        
        <!-- Sapaan & Tanggal -->
        <header class="home-header">
            <h1 id="daily-greeting" class="greeting-text">Selamat...</h1>
            <p id="current-date" class="date-text">Memuat tanggal...</p>
        </header>

        <!-- Mood Hari Ini -->
        <section class="mood-section">
            <h2 class="section-title">Bagaimana suasana hatimu hari ini?</h2>
            <p class="section-subtitle">Bisa pilih lebih dari satu!</p>
            <div id="mood-container" class="mood-container"></div>
        </section>

        <!-- Akses Cepat -->
        <section class="quick-access">
            <div class="access-card bounce-hover">Pencarian</div>
            <div class="access-card bounce-hover">Galeri</div>
            <div class="access-card bounce-hover">Statistik</div>
            <div class="access-card bounce-hover">Tag</div>
        </section>

        <!-- Kalender Mini -->
        <section class="calendar-section">
            <div class="calendar-card">
                <div class="calendar-header">
                    <button id="prev-month" class="nav-btn bounce-hover">&lt;</button>
                    <h2 id="calendar-month-year" class="calendar-title">Oktober 2026</h2>
                    <button id="next-month" class="nav-btn bounce-hover">&gt;</button>
                </div>
                <div class="calendar-weekdays">
                    <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
                </div>
                <div id="calendar-days" class="calendar-days"></div>
            </div>
        </section>

        <!-- Sorotan Tahunan (Buku & Film) -->
        <section class="highlights-section">
            <div class="section-header">
                <h2 class="section-title">Sorotan Tahunan 🎬📚</h2>
                <button class="text-btn">Lihat Semua</button>
            </div>
            <div id="yearly-highlights-container" class="horizontal-scroll"></div>
        </section>

        <!-- Jurnal Terbaru -->
        <section class="recent-journal-section">
            <div class="section-header">
                <h2 class="section-title">Jurnal Terbaru 📝</h2>
                <button class="text-btn">Librari</button>
            </div>
            <div id="recent-journal-container" class="vertical-list"></div>
        </section>

        <!-- Tombol Plus (Entry Baru) -->
        <button id="btn-add-new" class="fab-button bounce-hover" aria-label="Buat Entri Baru">+</button>

    </main>


    <!-- ========================================== -->
    <!-- 2. HALAMAN EDITOR JURNAL                   -->
    <!-- ========================================== -->
    <main id="editor-view" class="view-container">
        
        <!-- Header Editor -->
        <header class="editor-header">
            <button id="btn-back-home" class="icon-btn bounce-hover" aria-label="Kembali">⬅️</button>
            <div class="editor-meta">
                <span class="entry-date">18 Okt 2026</span>
                <span class="entry-status">Belum disimpan</span>
            </div>
            <button id="btn-save-entry" class="text-btn bounce-hover">Selesai</button>
        </header>

        <!-- Area Konten (Kanvas & Teks) -->
        <div id="editor-content-area" class="editor-content" data-entry-bg="polos">
            <!-- Lapisan Teks -->
            <div id="text-layer" class="text-layer" contenteditable="true">
                <h1 class="entry-title-input" data-placeholder="Judul Entri..."></h1>
                <p class="entry-body-input" data-placeholder="Mulai menulis cerita hari ini..."></p>
            </div>
            <!-- Lapisan Coretan -->
            <canvas id="draw-layer" class="draw-layer"></canvas>
        </div>

        <!-- Toolbar Bawah -->
        <footer class="editor-toolbar">
            
            <!-- Toolbar Utama -->
            <div id="main-toolbar" class="toolbar-scroll active-toolbar">
                <button id="btn-toggle-draw" class="tool-btn bounce-hover">🖍️ Mode Coret</button>
                <div class="toolbar-divider"></div>
                <button id="btn-toggle-format" class="tool-btn bounce-hover">Aa</button>
                <button id="btn-theme-bg" class="tool-btn bounce-hover">🎨 Latar</button>
                <button class="tool-btn bounce-hover">📷 Media</button>
                <button class="tool-btn bounce-hover">⭐ Rating</button>
                <button class="tool-btn bounce-hover">😊 Mood</button>
            </div>

            <!-- Toolbar Menggambar -->
            <div id="draw-toolbar" class="toolbar-scroll hidden-toolbar">
                <button id="btn-exit-draw" class="tool-btn bounce-hover active">✍️ Teks</button>
                <div class="toolbar-divider"></div>
                <button class="tool-btn draw-tool active" data-tool="pen" title="Pena Biasa">🖊️</button>
                <button class="tool-btn draw-tool" data-tool="highlight" title="Highlighter">🖍️</button>
                <button class="tool-btn draw-tool" data-tool="eraser" title="Penghapus">🧼</button>
