<!DOCTYPE html>
<html lang="en" data-theme="terang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal</title>
    
    <!-- Google Fonts: Menggunakan Quicksand untuk kesan "Cute-coded" tapi tetap bersih -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Core & Shared CSS -->
    <link rel="stylesheet" href="./core/theme.css">
    <link rel="stylesheet" href="./shared/global.css">
    
    <!-- Features CSS -->
    <link rel="stylesheet" href="./features/home/home.css">
    <link rel="stylesheet" href="./features/create-menu/create-menu.css">
    <link rel="stylesheet" href="./features/mood-widget/mood-widget.css">
    <link rel="stylesheet" href="./features/mini-calendar/mini-calendar.css">
    <link rel="stylesheet" href="./features/entry-highlights/entry-highlights.css">
</head>
<body>

    <!-- Container Utama Halaman Home -->
    <main id="home-view" class="view-container active">
        
        <!-- Bagian Atas: Sapaan & Tanggal -->
        <header class="home-header">
            <h1 id="daily-greeting" class="greeting-text">Selamat...</h1>
            <p id="current-date" class="date-text">Memuat tanggal...</p>
        </header>

        <!-- Bagian Mood Hari Ini -->
        <section class="mood-section">
            <h2 class="section-title">Bagaimana suasana hatimu hari ini?</h2>
            <p class="section-subtitle">Bisa pilih lebih dari satu!</p>
            <div id="mood-container" class="mood-container">
                <!-- Tombol-tombol mood akan di-generate oleh JS (mood-widget.js) -->
            </div>
        </section>

        <!-- Bagian Akses Cepat -->
        <section class="quick-access">
            <div class="access-card bounce-hover">Pencarian</div>
            <div class="access-card bounce-hover">Galeri</div>
            <div class="access-card bounce-hover">Statistik</div>
            <div class="access-card bounce-hover">Tag</div>
        </section>
<!-- FITUR BARU: Kalender Mini -->
      <section class="calendar-section">
          <div class="calendar-card">
          <div class="calendar-header">
            <button id="prev-month" class="nav-btn bounce-hover">&lt;</button>
            <h2 id="calendar-month-year" class="calendar-title">Oktober 2026</h2>
            <button id="next-month" class="nav-btn bounce-hover">&gt;</button>
        </div>
        
        <div class="calendar-weekdays">
            <span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span>
        </div>
        
        <div id="calendar-days" class="calendar-days">
            <!-- Tanggal akan di-generate oleh JS -->
        </div>
    </div>
</section>
        <!-- FITUR BARU: Buku & Film Tahunan (Scroll Menyamping) -->
<section class="highlights-section">
    <div class="section-header">
        <h2 class="section-title">Sorotan Tahunan 🎬📚</h2>
        <button class="text-btn">Lihat Semua</button>
    </div>
    <div id="yearly-highlights-container" class="horizontal-scroll">
        <!-- Kartu Film & Buku akan di-generate oleh JS -->
    </div>
</section>

<!-- FITUR BARU: Jurnal Terbaru -->
<section class="recent-journal-section">
    <div class="section-header">
        <h2 class="section-title">Jurnal Terbaru 📝</h2>
        <button class="text-btn">Librari</button>
    </div>
    <div id="recent-journal-container" class="vertical-list">
        <!-- Kartu Jurnal akan di-generate oleh JS -->
    </div>
</section>

        <!-- Tombol Plus (Entry Baru) -->
        <button id="btn-add-new" class="fab-button bounce-hover" aria-label="Buat Entri Baru">
            +
        </button>

    </main>

    <!-- Overlay dan Menu Pop-up Buat Baru (Berada di luar <main> agar bisa menutupi layar) -->
    <div id="create-menu-overlay" class="overlay hidden"></div>
    
    <div id="create-menu" class="create-menu hidden">
        <div class="menu-drag-handle"></div>
        <h3 class="menu-title">Buat Sesuatu yang Baru</h3>
        <div class="menu-options">
            <button class="menu-item bounce-hover" data-type="entry">📝 Entri Jurnal</button>
            <button class="menu-item bounce-hover" data-type="folder">📁 Folder Baru</button>
            <button class="menu-item bounce-hover" data-type="tag">🏷️ Tag Baru</button>
        </div>
    </div>

    <!-- JS Utama Terpisah menggunakan tipe modul -->
    <script type="module" src="./core/app.js"></script>
</body>
</html>
